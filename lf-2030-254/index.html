<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Office of Emergency Signal Coordination — Case LF-2030-254</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="">
<style>
  :root{ --bg:#03150b;--panel:#04240f;--text:#7dffa8;--accent:#22ff88;--accent2:#b6ff00;--alert:#ff4d4d;--grid:#0c3d1e; --mono:"Courier New",ui-monospace,Menlo,Consolas,monospace; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:15px;line-height:1.5;overflow-x:hidden}
  a{color:var(--accent2)}
  .scanlines::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0,rgba(0,0,0,.18) 1px,transparent 1px,transparent 3px)}
  .scanlines::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:51;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
  @keyframes flick{0%,100%{opacity:1}97%{opacity:1}98%{opacity:.86}99%{opacity:.97}}
  .wrap{max-width:1100px;margin:0 auto;padding:16px;animation:flick 6s infinite}
  .topbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;border:1px solid var(--grid);background:var(--panel);padding:10px 14px;border-radius:4px}
  .topbar b{color:var(--accent)}
  .badge{border:1px solid var(--accent);color:var(--accent);padding:1px 8px;border-radius:3px;font-size:12px;letter-spacing:.08em}
  .cls{color:var(--alert);border-color:var(--alert);animation:blink 1.4s steps(2) infinite}
  @keyframes blink{50%{opacity:.35}}
  .grow{flex:1}
  .meter{display:inline-flex;gap:3px;vertical-align:middle}
  .meter i{width:12px;height:12px;background:var(--grid);display:inline-block;border-radius:2px}
  .meter i.on{background:var(--alert);box-shadow:0 0 6px var(--alert)}
  .layout{display:flex;gap:16px;margin-top:14px}
  nav{flex:0 0 190px;border:1px solid var(--grid);background:var(--panel);border-radius:4px;padding:8px;height:max-content}
  nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--text);font-family:var(--mono);font-size:14px;padding:8px 10px;cursor:pointer;border-radius:3px;letter-spacing:.04em}
  nav button:hover{background:var(--grid)}
  nav button.active{background:var(--accent);color:var(--bg);font-weight:bold}
  nav button.navhome{color:var(--accent2);border-bottom:1px dashed var(--grid);border-radius:0;margin-bottom:6px;padding-bottom:12px;letter-spacing:.1em}
  nav button.navhome:hover{background:var(--grid);color:var(--accent)}
  main{flex:1;min-width:0;border:1px solid var(--grid);background:var(--panel);border-radius:4px;padding:18px;min-height:60vh}
  h1{font-size:20px;margin:0 0 4px;color:var(--accent);letter-spacing:.06em}
  h2{font-size:15px;color:var(--accent2);border-bottom:1px dashed var(--grid);padding-bottom:6px;margin:0 0 12px;letter-spacing:.08em}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:10px 0}
  .kv .k{color:var(--accent);text-transform:uppercase;font-size:12px;letter-spacing:.06em}
  .card{border:1px solid var(--grid);border-radius:4px;padding:12px;margin:10px 0;background:rgba(0,0,0,.18);overflow:hidden}
  .card .name{color:var(--accent);font-weight:bold}
  .imgframe{position:relative;border:1px solid var(--grid);border-radius:4px;overflow:hidden;margin:10px 0}
  .imgframe img{display:block;width:100%;filter:grayscale(.65) contrast(1.06) brightness(.92)}
  .imgframe::after{content:"";position:absolute;inset:0;background:var(--accent);opacity:.13;mix-blend-mode:overlay;pointer-events:none}
  .imgframe::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0,rgba(0,0,0,.16) 1px,transparent 1px,transparent 3px)}
  .imgframe .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;background:linear-gradient(transparent,rgba(0,0,0,.75));color:var(--accent);font-size:11px;letter-spacing:.08em;padding:14px 10px 6px}
  .embed{position:relative;width:100%;padding-top:56.25%;border:1px solid var(--grid);border-radius:4px;overflow:hidden;margin:10px 0;background:#000}
  .embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .portrait{width:92px;height:112px;object-fit:cover;float:left;margin:2px 12px 6px 0;border:1px solid var(--grid);filter:grayscale(.75) contrast(1.06)}
  .st{font-size:11px;padding:1px 7px;border-radius:3px;border:1px solid;letter-spacing:.06em}
  .st.ALIVE,.st.SECURE{color:var(--accent);border-color:var(--accent)}
  .st.MISSING,.st.QUARANTINE,.st.EVACUATED,.st.DETAINED,.st.UNKNOWN{color:var(--accent2);border-color:var(--accent2)}
  .st.DECEASED,.st.LOST{color:var(--alert);border-color:var(--alert)}
  .log{white-space:pre-wrap}
  .log .row{display:flex;gap:12px;padding:6px 0;border-bottom:1px dotted var(--grid)}
  .log .ts{color:var(--accent);flex:0 0 64px}
  .term{margin-top:14px;border:1px solid var(--grid);background:var(--panel);border-radius:4px;padding:10px 14px;display:flex;gap:8px;align-items:center}
  .term span{color:var(--accent)}
  .term input{flex:1;background:transparent;border:0;color:var(--text);font-family:var(--mono);font-size:15px;outline:none}
  .out{margin-top:8px;color:var(--accent2);min-height:20px}
  .locked{text-align:center;padding:26px}
  .locked input{background:var(--bg);border:1px solid var(--accent);color:var(--text);font-family:var(--mono);font-size:16px;padding:8px 12px;letter-spacing:.3em;text-align:center;border-radius:3px}
  .locked button{margin-left:8px;background:var(--accent);color:var(--bg);border:0;padding:9px 16px;font-family:var(--mono);cursor:pointer;border-radius:3px;font-weight:bold}
  .disclaimer{margin-top:16px;text-align:center;font-size:11px;color:var(--text);opacity:.55;letter-spacing:.05em}
  .directives{display:flex;flex-wrap:wrap;gap:8px}
  .directives span{border:1px solid var(--accent);color:var(--accent);padding:4px 10px;border-radius:3px;font-size:12px;letter-spacing:.06em}
  .clik{cursor:pointer;transition:border-color .15s,background .15s}
  .clik:hover{border-color:var(--accent);background:rgba(255,255,255,.03)}
  .clik .more{color:var(--accent);font-size:11px;letter-spacing:.08em;opacity:.85;margin-top:6px}
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:70;display:flex;align-items:center;justify-content:center;padding:18px}
  #overlay .box{background:var(--panel);border:1px solid var(--accent);border-radius:6px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:22px;position:relative;box-shadow:0 0 44px rgba(0,0,0,.7)}
  #overlay .x{position:absolute;top:6px;right:10px;cursor:pointer;color:var(--accent);font-size:22px;background:none;border:0;line-height:1}
  #overlay .stamp{display:inline-block;border:2px solid var(--alert);color:var(--alert);padding:2px 10px;border-radius:3px;font-size:12px;letter-spacing:.14em;transform:rotate(-6deg);opacity:.9;margin-bottom:8px}
  .file-photo{width:148px;height:178px;object-fit:cover;float:left;margin:0 16px 10px 0;border:1px solid var(--grid);filter:grayscale(.7) contrast(1.06)}
  .findings{list-style:none;padding:0;margin:10px 0}
  .findings li{padding:6px 0;border-bottom:1px dotted var(--grid)}
  .findings li::before{content:"\25AE\25AE ";color:var(--alert)}
  .final{border-left:3px solid var(--alert);padding:8px 12px;margin-top:12px;background:rgba(0,0,0,.25);font-style:italic}
  .map-wrap{position:relative;border:1px solid var(--grid);border-radius:4px;background:radial-gradient(circle at center,rgba(0,0,0,.15),rgba(0,0,0,.5));margin:10px 0}
  .map-wrap svg{display:block;width:100%;height:auto}
  @keyframes sweep{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  .blip{cursor:pointer}
  .blip .dot{animation:pulse 2s infinite}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:11px;letter-spacing:.05em}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .leafmap{height:420px;border:1px solid var(--grid);border-radius:4px;overflow:hidden;position:relative}
  .leaflet-container{background:#05070a!important;font-family:var(--mono)!important}
  .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9) saturate(.55)}
  .maptint{position:absolute;inset:0;z-index:400;pointer-events:none;background:var(--accent);opacity:.08;mix-blend-mode:overlay}
  .maptint2{position:absolute;inset:0;z-index:401;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0,rgba(0,0,0,.14) 1px,transparent 1px,transparent 3px)}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel)!important;color:var(--text)!important;border:1px solid var(--accent)}
  .pin{width:14px;height:14px;border-radius:50%;border:2px solid #000;box-shadow:0 0 8px currentColor;animation:pulse 2s infinite}
  .imgframe img,.file-photo{cursor:zoom-in}
  #overlay .box img[data-lb]{max-width:100%;max-height:78vh;display:block;margin:0 auto}
  .findings li .red{background:#000;color:#000;cursor:pointer;padding:0 4px;border-radius:2px;transition:color .2s,background .2s;user-select:none}
  .findings li .red.on{background:transparent;color:var(--text)}
  .tx{cursor:pointer}
  .wave{display:inline-flex;gap:2px;height:12px;align-items:flex-end;margin-left:10px;vertical-align:middle}
  .wave i{width:2px;background:var(--accent);height:3px}
  .wave.live i,.tx.playing .wave i{animation:vu .45s infinite alternate}
  @keyframes vu{to{height:100%}}
  .playbtn{background:var(--accent);color:var(--bg);border:0;padding:8px 14px;border-radius:3px;font-family:var(--mono);font-weight:bold;cursor:pointer;margin-bottom:10px;letter-spacing:.06em}
  .ackable{cursor:pointer;position:relative;padding-right:44px!important}
  .ackable.ack{opacity:.7}
  .ackable.ack::after{content:"\2713 ACK";position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--accent)}
  .live{color:var(--alert)!important;border-color:var(--alert)!important;font-weight:bold;letter-spacing:.08em}
  .live::before{content:"\25CF";margin-right:5px;display:inline-block;animation:blink 1.2s steps(2) infinite}
  .topbar button.badge{background:transparent;font-family:var(--mono);cursor:pointer}
  .topbar button.badge.on{background:var(--accent);color:var(--bg)}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
  .filters button{background:transparent;border:1px solid var(--grid);color:var(--text);font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:3px;cursor:pointer;letter-spacing:.05em}
  .filters button.on{background:var(--accent);color:var(--bg)}
  .xlink{color:var(--accent2);cursor:pointer;text-decoration:underline dotted}
  .beacon{width:14px;height:14px;border-radius:50%;background:var(--alert);box-shadow:0 0 12px var(--alert);position:relative}
  .beacon::after{content:"";position:absolute;inset:-6px;border:2px solid var(--alert);border-radius:50%;animation:ping 1.6s infinite}
  @keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.4);opacity:0}}
  .briefing{position:fixed;left:0;right:0;bottom:0;z-index:65;background:var(--panel);border-top:1px solid var(--accent);padding:9px 16px;display:flex;gap:12px;align-items:center;font-size:12px}
  .briefing button{background:var(--accent);color:var(--bg);border:0;padding:5px 14px;border-radius:3px;cursor:pointer;font-family:var(--mono);font-weight:bold}
  #boot{position:fixed;inset:0;background:var(--bg);z-index:60;padding:6vh 6vw;white-space:pre-wrap;color:var(--accent);cursor:pointer}
  #boot .hint{position:absolute;bottom:5vh;left:0;right:0;text-align:center;color:var(--text);opacity:.6;font-size:12px}
  .hidden{display:none!important}
  @media(max-width:720px){ .layout{flex-direction:column} nav{flex:none;display:flex;flex-wrap:wrap;gap:4px} nav button{width:auto} .kv{grid-template-columns:1fr} }
</style>
</head>

":"Runways submerged in violet sludge.","event":"Total geographic erasure as artificial fill turns to mush; all flights grounded or crashed.","lat":42.363,"lon":-71.006},{"name":"Revere (Great Marsh)","status":"UNKNOWN","population":"53000","note":"Reports of 'living silt' moving inland.","event":"The wetlands have mutated into a mobile barrier, preventing evacuation via northern routes.","lat":42.408,"lon":-71.012},{"name":"Framingham","status":"SECURE","population":"72000","note":"Location of MEMA command bunker.","event":"Primary site for coordination of the debris dam ordnance strikes.","lat":42.279,"lon":-71.416}],"transmissions":[{"timestamp":"04:15","source":"Oskar","text":"The seal on the outfall tunnel didn't just leak—it disintegrated."},{"timestamp":"05:50","source":"Enzo","text":"The water is thick like syrup, and it's glowing a dull, sickly violet."},{"timestamp":"06:22","source":"Lorna (Revere)","text":"The tide came into the basement and the cat started screaming before it just... dissolved."},{"timestamp":"07:05","source":"MEMA Encrypted","text":"Sacrifice the Seaport. Drop the Ted Williams. Contain the byproduct."}],"directives":["TURN OFF ALL WATER TAPS","SEAL DRAINS WITH PLASTIC SHEETING","DO NOT TOUCH THE MIST","EVACUATE WEST OF I-95 IMMEDIATELY","AVOID ALL TUNNELS AND BRIDGES"],"classified":{"summary":"The Deer Island 'Egg' Digesters were never intended for waste management; they were anaerobic incubators for a pre-Cambrian organism recovered during the Big Dig excavations. The 'Great Wall' was a containment vessel designed to keep the specimen submerged in a methane-rich environment until it could be weaponized.","findings":["Specimen recovered at depth of 150ft during slurry wall construction, 1994.","Anaerobic Digesters repurposed as nutrient-delivery systems.","Public 'Cleanup of the 90s' was a cover for sediment-layer containment.","Project Outfall authorized the use of civilian infrastructure as a biological cage.","Current breach suggests const $ = (id)=>document.getElementById(id);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const E = (s)=>String(s==null?"":s).replace(/[<>&]/g,(c)=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
var __pf="ALL", __zf="ALL", __hum=null, __brief=null;
var BRIEF_SEQ=["overview","threat","map","timeline","transmissions","classified"];

const SECTIONS = [
  ["OVERVIEW","overview"],["VIDEO","video"],["THREAT ANALYSIS","threat"],["PERSONNEL","personnel"],
  ["TACTICAL MAP","map"],["TIMELINE","timeline"],["TRANSMISSIONS","transmissions"],
  ["DIRECTIVES","directives"],["CLASSIFIED","classified"],
];

function init(){ render("overview"); }

function topbar(){
  $("tb-agency").textContent=D.agency;
  $("tb-abbr").textContent=D.agencyAbbr;
  $("tb-case").textContent=D.caseNumber;
  $("tb-cls").textContent=D.classification;
  $("tb-freq").textContent=D.frequency;
  const m=$("tb-meter"); for(let k=1;k<=5;k++){const i=el("i");if(k<=D.threatLevel)i.className="on";m.appendChild(i);}
  $("disc").textContent="FICTIONAL ENTERTAINMENT — This is an Alternate Reality Game for the Last Frequency. "+D.agency+" is not a real organization and this is not a real emergency system.";
  const nav=$("nav");
  // HOME — back to the main site. "../" resolves to the site root from "/<case>/"
  // whether served on the custom domain or a github.io project path.
  var home=el("button","navhome",'⌂ HOME'); home.onclick=function(){ window.location.href="../"; }; nav.appendChild(home);
  SECTIONS.forEach(([label,id])=>{const b=el("button",null,label);b.dataset.id=id;b.onclick=()=>render(id);nav.appendChild(b);});
  const tb=document.querySelector(".topbar");
  const brief=el("button","badge",'▶ BRIEFING'); brief.id="tb-brief"; brief.onclick=function(){ startBriefing(); }; tb.appendChild(brief);
  const hum=el("button","badge",'🔈 HUM'); hum.id="tb-hum"; hum.onclick=function(){ toggleHum(hum); }; tb.appendChild(hum);
}

function setActive(id){ [...$("nav").children].forEach(b=>b.classList.toggle("active",b.dataset.id===id)); }

function render(id){
  setActive(id); const m=$("main"); m.innerHTML="";
  if(id==="overview"){
    m.appendChild(el("h1",null,E(D.incident.title)));
    m.appendChild(el("div",null,'<span class="badge">'+E(D.incident.status)+'</span>'));
    if(D.incident.imageData) m.appendChild(imgFrame(D.incident.imageData,"FIG.1 — INCIDENT SITE"));
    m.appendChild(kv({ "Case #":D.caseNumber, "Location":D.incident.location, "Date":D.incident.date, "Threat Level":D.threatLevel+" / 5" }));
    m.appendChild(el("p",null,E(D.incident.summary)));
  } else if(id==="video"){
    m.appendChild(el("h2",null,"BROADCAST FOOTAGE"));
    if(D.youtubeId){
      m.appendChild(el("div","embed",'<iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(D.youtubeId)+'" title="Broadcast" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe>'));
      m.appendChild(el("p",null,'<a href="https://youtu.be/'+encodeURIComponent(D.youtubeId)+'" target="_blank" style="color:var(--accent2)">▶ Watch on YouTube</a>'));
    } else {
      m.appendChild(el("div","card",'<p style="opacity:.8">Broadcast footage for this case has not been attached yet. Check back when the transmission goes live.</p>'));
    }
  } else if(id==="threat"){
    m.appendChild(el("h2",null,"THREAT ANALYSIS"));
    m.appendChild(el("h1",null,E(D.threat.name)));
    if(D.threat.imageData) m.appendChild(imgFrame(D.threat.imageData,"SPECIMEN // "+E(D.threat.type)));
    m.appendChild(kv({ "Type":D.threat.type, "Origin":D.threat.origin, "Transmission":D.threat.transmission, "Effects":D.threat.effects, "Containment":D.threat.containment }));
  } else if(id==="personnel"){
    m.appendChild(el("h2",null,"PERSONNEL FILES"));
    m.appendChild(el("p",null,'<span style="opacity:.7">Click any file to open the full record.</span>'));
    var pstats=["ALL"].concat(["ALIVE","MISSING","DECEASED","DETAINED","UNKNOWN"].filter(function(s){return D.personnel.some(function(p){return p.status===s;});}));
    var pf=el("div","filters"); pstats.forEach(function(s){ var b=el("button",__pf===s?"on":"",s); b.onclick=function(){ __pf=s; render("personnel"); }; pf.appendChild(b); }); m.appendChild(pf);
    D.personnel.filter(function(p){ return __pf==="ALL"||p.status===__pf; }).forEach(function(p){ const c=el("div","card clik");
      c.innerHTML=(p.photoData?'<img class="portrait" src="'+p.photoData+'" alt="">':'')+'<div><span class="name">'+E(p.name)+'</span> <span class="st '+E(p.status)+'">'+E(p.status)+'</span></div><div style="opacity:.85">'+E(p.role)+(p.lastKnown?' — last seen '+E(p.lastKnown):'')+'</div>'+(p.note?'<div style="margin-top:6px">'+E(p.note)+'</div>':'')+'<div class="more">▶ OPEN FULL FILE</div>';
      c.onclick=function(){ openModal(personFile(p)); }; m.appendChild(c); });
  } else if(id==="map"){
    m.appendChild(el("h2",null,"TACTICAL MAP // "+E(D.incident.location)));
    m.appendChild(el("p",null,'<span style="opacity:.7">Click a marker to see what happened there.</span>'));
    var zstats=["ALL"].concat(["SECURE","QUARANTINE","EVACUATED","LOST"].filter(function(s){return D.zones.some(function(z){return z.status===s;});}));
    var zf=el("div","filters"); zstats.forEach(function(s){ var b=el("button",__zf===s?"on":"",s); b.onclick=function(){ __zf=s; render("map"); }; zf.appendChild(b); }); m.appendChild(zf);
    m.appendChild(buildMap());
  } else if(id==="timeline"){
    m.appendChild(el("h2",null,"INCIDENT TIMELINE"));
    const pb=el("button","playbtn","▶ PLAY SEQUENCE"); m.appendChild(pb);
    const log=el("div","log");
    D.timeline.forEach(function(t){ const row=el("div","row"+(t.detail?" clik":"")); row.innerHTML='<span class="ts">'+E(t.time)+'</span><span>'+E(t.event)+(t.detail?' <span style="color:var(--accent)">▶</span>':'')+'</span>'; if(t.detail) row.onclick=function(){ openModal('<span class="stamp">LOG ENTRY</span><h1>'+E(t.time)+'</h1><p>'+E(t.detail)+'</p>'); beep(660,0.05); }; log.appendChild(row); });
    m.appendChild(log);
    pb.onclick=function(){ playTimeline(log); };
  } else if(id==="transmissions"){
    m.appendChild(el("h2",null,"INTERCEPTED TRANSMISSIONS"));
    m.appendChild(el("p",null,'<span style="opacity:.7">Click a transmission to play it.</span>'));
    const log=el("div","log");
    D.transmissions.forEach(function(t){ const row=el("div","row tx"); row.innerHTML='<span class="ts">'+E(t.timestamp)+'</span><span><b style="color:var(--accent)">'+E(t.source)+':</b> '+E(t.text)+'<span class="wave"><i></i><i></i><i></i><i></i><i></i></span></span>'; row.onclick=function(){ playStatic(row); openModal('<span class="stamp">AUDIO LOG</span><h1>'+E(t.source)+' &middot; '+E(t.timestamp)+'</h1>'+waveBox()+'<p>“'+E(t.text)+'”</p>'); }; log.appendChild(row); });
    m.appendChild(log);
  } else if(id==="directives"){
    m.appendChild(el("h2",null,"CIVIL DIRECTIVES"));
    m.appendChild(el("p",null,'<span style="opacity:.7">Click to acknowledge each directive.</span>'));
    const d=el("div","directives");
    D.directives.forEach(function(x,i){ const s=el("span","ackable"); s.textContent=x; const key="ack_"+D.caseNumber+"_"+i; try{ if(localStorage.getItem(key)==="1") s.classList.add("ack"); }catch(e){} s.onclick=function(){ s.classList.toggle("ack"); try{ localStorage.setItem(key,s.classList.contains("ack")?"1":"0"); }catch(e){} beep(880,0.05); }; d.appendChild(s); });
    m.appendChild(d);
  } else if(id==="classified"){
    m.appendChild(el("h2",null,"CLASSIFIED // RESTRICTED"));
    m.appendChild(el("div",null,'<span class="stamp">DECLASSIFIED</span>'));
    if(D.classified.imageData) m.appendChild(imgFrame(D.classified.imageData,"EXHIBIT A — LEAKED"));
    m.appendChild(el("p",null,E(D.classified.summary)));
    if(D.classified.findings && D.classified.findings.length){
      m.appendChild(el("h2",null,"REDACTED FINDINGS"));
      m.appendChild(el("p",null,'<span style="opacity:.7">Click a redacted line to declassify it.</span>'));
      const ul=el("ul","findings");
      D.classified.findings.forEach(function(f){ const li=el("li"); const sp=el("span","red"); sp.textContent=f; sp.title="click to declassify"; sp.onclick=function(){ sp.classList.toggle("on"); beep(440,0.04); }; li.appendChild(sp); ul.appendChild(li); });
      m.appendChild(ul);
    }
    if(D.classified.finalEntry) m.appendChild(el("div","final","“"+E(D.classified.finalEntry)+"”"));
  }
}
function kv(obj){ const d=el("div","kv"); Object.entries(obj).forEach(([k,v])=>{d.appendChild(el("div","k",E(k)));d.appendChild(el("div",null,E(v)));}); return d; }
function imgFrame(src,cap){ return el("div","imgframe",'<img src="'+src+'" alt="">'+(cap?'<div class="cap">'+E(cap)+'</div>':'')); }
function kvHtml(obj){ var h='<div class="kv">'; Object.keys(obj).forEach(function(k){ h+='<div class="k">'+E(k)+'</div><div>'+E(obj[k])+'</div>'; }); return h+'</div>'; }
function jsStr(s){ return String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"").replace(/</g,""); }
function findZone(name){ var n=String(name||"").toLowerCase().trim(); if(!n)return null; return D.zones.filter(function(z){ var zn=(z.name||"").toLowerCase(); return zn && (n.indexOf(zn)>=0 || zn.indexOf(n)>=0); })[0]||null; }
function gotoZone(name){ var z=findZone(name); closeModal(); render("map"); if(z) setTimeout(function(){ openModal(zoneFile(z)); },500); }
function personFile(p){
  var photo = p.photoData?'<img class="file-photo" src="'+p.photoData+'" alt="">':'';
  var lk = p.lastKnown ? (findZone(p.lastKnown)?'<span class="xlink" onclick="gotoZone(\''+jsStr(p.lastKnown)+'\')">'+E(p.lastKnown)+' ▸ map</span>':E(p.lastKnown)) : "—";
  var rows = '<div class="kv"><div class="k">Status</div><div>'+E(p.status)+'</div><div class="k">Role</div><div>'+E(p.role)+'</div><div class="k">Alias</div><div>'+E(p.aliases||"—")+'</div><div class="k">Age</div><div>'+E(p.age||"—")+'</div><div class="k">Last Known</div><div>'+lk+'</div><div class="k">Last Contact</div><div>'+E(p.lastContact||"—")+'</div></div>';
  return '<span class="stamp">PERSONNEL FILE</span>'+photo+'<h1>'+E(p.name)+'</h1>'+rows+
    (p.background?'<h2>BACKGROUND</h2><p>'+E(p.background)+'</p>':'')+
    (p.assessment?'<h2>AGENCY ASSESSMENT</h2><p>'+E(p.assessment)+'</p>':'')+
    (p.note?'<p style="opacity:.85">'+E(p.note)+'</p>':'');
}
function zoneFile(z){
  var rows = kvHtml({ "Status":z.status, "Population":z.population||"—" });
  return '<span class="stamp">ZONE REPORT</span><h1>'+E(z.name)+'</h1>'+rows+
    (z.event?'<h2>WHAT HAPPENED HERE</h2><p>'+E(z.event)+'</p>':'')+
    (z.note?'<p style="opacity:.85">'+E(z.note)+'</p>':'');
}
function openModal(html){ $("overlay").querySelector(".body").innerHTML=html; $("overlay").classList.remove("hidden"); $("overlay").scrollTop=0; }
function closeModal(){ $("overlay").classList.add("hidden"); }

function zoneColor(s){ return (s==="LOST")?"var(--alert)":(s==="SECURE")?"var(--accent)":"var(--accent2)"; }
function hashN(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }

// ── Audio (WebAudio — no external assets) ─────────────────────────────────────
var __ac=null;
function ac(){ if(!__ac){ try{ __ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return __ac; }
function beep(freq,dur){ var c=ac(); if(!c)return; try{ var o=c.createOscillator(),g=c.createGain(); o.type="square"; o.frequency.value=freq; g.gain.value=0.04; o.connect(g); g.connect(c.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur); o.stop(c.currentTime+dur); }catch(e){} }
function playStatic(row){ var c=ac(); if(!c)return; try{ if(row){ row.classList.add("playing"); setTimeout(function(){ row.classList.remove("playing"); },900); } var len=Math.floor(c.sampleRate*0.7); var b=c.createBuffer(1,len,c.sampleRate); var d=b.getChannelData(0); for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*0.28*(1-i/len); } var s=c.createBufferSource(); s.buffer=b; var g=c.createGain(); g.gain.value=0.5; s.connect(g); g.connect(c.destination); s.start(); beep(520,0.08); }catch(e){} }
function waveBox(){ var bars=''; for(var i=0;i<28;i++){ bars+='<i style="animation-delay:'+(i*0.03)+'s"></i>'; } return '<div class="imgframe" style="padding:16px"><div class="wave live" style="height:46px;justify-content:center">'+bars+'</div></div>'; }
function playTimeline(log){ var rows=[].slice.call(log.children); rows.forEach(function(r){ r.style.opacity="0.25"; }); var i=0; (function step(){ if(i>=rows.length)return; rows[i].style.opacity="1"; beep(600+i*30,0.05); i++; setTimeout(step,750); })(); }
function toggleHum(btn){ var c=ac(); if(!c)return; if(__hum){ try{ __hum.osc.stop(); __hum.noise.stop(); }catch(e){} __hum=null; if(btn){btn.classList.remove("on");btn.textContent="🔈 HUM";} return; } try{
  var osc=c.createOscillator(); osc.type="sine"; osc.frequency.value=58; var og=c.createGain(); og.gain.value=0.025; osc.connect(og); og.connect(c.destination); osc.start();
  var len=Math.floor(c.sampleRate*2); var b=c.createBuffer(1,len,c.sampleRate); var d=b.getChannelData(0); for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*0.02; }
  var noise=c.createBufferSource(); noise.buffer=b; noise.loop=true; var lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=760; var ng=c.createGain(); ng.gain.value=0.5; noise.connect(lp); lp.connect(ng); ng.connect(c.destination); noise.start();
  __hum={osc:osc,noise:noise}; if(btn){btn.classList.add("on");btn.textContent="🔇 HUM";}
}catch(e){} }
function startBriefing(){ if(__brief){ stopBriefing(); return; } var bar=el("div","briefing"); bar.id="briefbar"; bar.innerHTML='<span class="live">BRIEFING</span><span id="briefstep" style="flex:1"></span><button onclick="stopBriefing()">STOP</button>'; document.body.appendChild(bar); var btn=$("tb-brief"); if(btn) btn.classList.add("on"); var i=0; (function step(){ if(i>=BRIEF_SEQ.length){ stopBriefing(); return; } var id=BRIEF_SEQ[i]; render(id); var lbl=(SECTIONS.filter(function(s){return s[1]===id;})[0]||["",""])[0]; var st=$("briefstep"); if(st) st.textContent=(i+1)+" / "+BRIEF_SEQ.length+"   "+lbl; beep(700,0.05); i++; __brief=setTimeout(step,4200); })(); }
function stopBriefing(){ if(__brief){ clearTimeout(__brief); __brief=null; } var bar=$("briefbar"); if(bar) bar.remove(); var btn=$("tb-brief"); if(btn) btn.classList.remove("on"); }

// ── Map: a REAL city map (Leaflet + dark tiles), radar as offline fallback ────
var __mapN=0;
function buildMap(){
  var hasGeo = typeof D.incident.lat==="number" && typeof D.incident.lon==="number" && window.L;
  if(!hasGeo) return radarMap();
  var box=el("div");
  var id="leafmap"+(++__mapN);
  var holder=el("div","leafmap"); holder.id=id; holder.innerHTML='<div class="maptint"></div><div class="maptint2"></div>';
  box.appendChild(holder);
  box.appendChild(el("div","legend",'<span><i style="background:var(--accent)"></i>SECURE / ORIGIN</span><span><i style="background:var(--accent2)"></i>QUARANTINE / EVAC</span><span><i style="background:var(--alert)"></i>LOST</span>'));
  setTimeout(function(){ initLeaflet(id); },30);
  return box;
}
function pinIcon(color){ return L.divIcon({className:"",html:'<div class="pin" style="color:'+color+';background:'+color+'"></div>',iconSize:[14,14],iconAnchor:[7,7]}); }
function initLeaflet(id){
  try{
    var map=L.map(id,{scrollWheelZoom:false,attributionControl:true}).setView([D.incident.lat,D.incident.lon],12);
    // Standard OpenStreetMap tiles (NO API key) darkened to a tactical look via
    // the CSS filter on .leaflet-tile-pane below.
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{subdomains:"abc",maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
    var pts=[[D.incident.lat,D.incident.lon]];
    // Distress beacon at ground zero (pulsing SOS).
    L.marker([D.incident.lat,D.incident.lon],{icon:L.divIcon({className:"",html:'<div class="beacon"></div>',iconSize:[14,14],iconAnchor:[7,7]}),zIndexOffset:1000}).addTo(map).bindPopup("<b>GROUND ZERO</b><br>"+E(D.incident.location));
    D.zones.filter(function(z){ return __zf==="ALL"||z.status===__zf; }).forEach(function(z){ if(typeof z.lat==="number" && typeof z.lon==="number"){ var col=zoneColor(z.status); var mk=L.marker([z.lat,z.lon],{icon:pinIcon(col)}).addTo(map); mk.bindTooltip(z.name+" — "+z.status); mk.on("click",function(){ openModal(zoneFile(z)); }); pts.push([z.lat,z.lon]); } });
    if(pts.length>1){ try{ map.fitBounds(pts,{padding:[42,42],maxZoom:14}); }catch(e){} }
    setTimeout(function(){ try{ map.invalidateSize(); }catch(e){} },80);
  }catch(e){ var h=$(id); if(h) h.innerHTML='<div style="padding:20px;opacity:.7">Map unavailable offline.</div>'; }
}
function radarMap(){
  var svg='';
  for(var r=40;r<=180;r+=46){ svg+='<circle cx="200" cy="200" r="'+r+'" fill="none" stroke="var(--grid)" stroke-width="1"/>'; }
  svg+='<line x1="200" y1="20" x2="200" y2="380" stroke="var(--grid)"/><line x1="20" y1="200" x2="380" y2="200" stroke="var(--grid)"/>';
  svg+='<defs><linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--accent)" stop-opacity="0"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0.45"/></linearGradient></defs>';
  svg+='<g style="transform-origin:200px 200px;animation:sweep 4.5s linear infinite"><path d="M200 200 L200 20 A180 180 0 0 1 336 118 Z" fill="url(#sw)"/></g>';
  svg+='<circle cx="200" cy="200" r="4" fill="var(--accent)"/><text x="200" y="218" fill="var(--accent)" font-size="10" text-anchor="middle" font-family="monospace">'+E((D.incident.location||"").slice(0,20))+'</text>';
  var blips='';
  D.zones.forEach(function(z,i){
    var h=hashN(z.name+i); var ang=(h%360)*Math.PI/180; var rad=55+(h%108);
    var x=Math.round(200+Math.cos(ang)*rad), y=Math.round(200+Math.sin(ang)*rad); var col=zoneColor(z.status);
    blips+='<g class="blip" data-i="'+i+'"><circle class="dot" cx="'+x+'" cy="'+y+'" r="6" fill="'+col+'"/><circle cx="'+x+'" cy="'+y+'" r="11" fill="none" stroke="'+col+'" stroke-width="1" opacity="0.5"/><text x="'+(x+10)+'" y="'+(y+4)+'" fill="'+col+'" font-size="10" font-family="monospace">'+E(z.name.slice(0,16))+'</text></g>';
  });
  var wrap=el("div","map-wrap"); wrap.innerHTML='<svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">'+svg+blips+'</svg>';
  wrap.querySelectorAll(".blip").forEach(function(g){ g.addEventListener("click",function(){ openModal(zoneFile(D.zones[+g.dataset.i])); }); });
  var leg=el("div","legend",'<span><i style="background:var(--accent)"></i>SECURE</span><span><i style="background:var(--accent2)"></i>QUARANTINE / EVAC</span><span><i style="background:var(--alert)"></i>LOST</span>');
  var box=el("div"); box.appendChild(wrap); box.appendChild(leg); return box;
}

topbar();
// Live clock + signal indicator in the top bar.
(function(){ var clk=el("span","badge live"); document.querySelector(".topbar").appendChild(clk); function t(){ clk.textContent="LIVE "+new Date().toISOString().slice(11,19)+"Z"; } t(); setInterval(t,1000); })();
// Click any evidence image to view it full-size (lightbox).
document.addEventListener("click",function(e){ var t=e.target; if(t && t.tagName==="IMG" && (t.closest(".imgframe")||t.classList.contains("file-photo"))){ e.stopPropagation(); openModal('<img data-lb src="'+t.src+'" alt="">'); } });
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeModal(); });
$("overlay").addEventListener("click",function(e){ if(e.target.id==="overlay") closeModal(); });
init();
</script>
